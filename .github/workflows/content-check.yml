name: Content check

on:
  push:
    branches:
      - main
    paths:
      - "md/**"
      - "content-index.json"
      - "content-relations.json"
      - "article.schema.json"
      - "scripts/content_index.py"
      - "requirements-dev.txt"
      - "assets/app.js"
      - "index.html"
      - "admin-reports.html"
      - "404.html"
      - "site-config.json"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "scripts/seo_artifacts.py"
      - "scripts/style_audit.py"
      - "DEPLOYMENT.md"
      - ".env.example"
      - ".github/workflows/content-check.yml"
  pull_request:
    paths:
      - "md/**"
      - "content-index.json"
      - "content-relations.json"
      - "article.schema.json"
      - "scripts/content_index.py"
      - "requirements-dev.txt"
      - "assets/app.js"
      - "index.html"
      - "admin-reports.html"
      - "404.html"
      - "site-config.json"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "scripts/seo_artifacts.py"
      - "scripts/style_audit.py"
      - "DEPLOYMENT.md"
      - ".env.example"
      - ".github/workflows/content-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate metadata, relations and internal links
        run: python scripts/content_index.py

      - name: Check generated content index
        run: python scripts/content_index.py --check

      - name: Check frontend JavaScript syntax
        run: node --check assets/app.js

      - name: Check SEO and LLM artifacts
        run: python scripts/seo_artifacts.py --check

      - name: Check typography and public work traces
        run: python scripts/style_audit.py
