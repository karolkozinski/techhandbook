name: Deployment check

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/generate_nginx_routes.py"
      - "scripts/prerender.py"
      - "requirements-prerender.txt"
      - "index.html"
      - "content-index.json"
      - "site-config.json"
      - "md/**"
      - ".github/workflows/deploy-check.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - "deploy/**"
      - "scripts/generate_nginx_routes.py"
      - "scripts/prerender.py"
      - "requirements-prerender.txt"
      - "index.html"
      - "content-index.json"
      - "site-config.json"
      - "md/**"
      - ".github/workflows/deploy-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build production image
        run: docker build --pull -t techhandbook-ci .

      - name: Start test container
        run: docker run --rm -d --name techhandbook-ci -p 127.0.0.1:18080:8080 techhandbook-ci

      - name: Smoke test
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/healthz | grep -qx "ok"
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/pl/programming/python/python-podstawy | grep -Fq '<title>Python - podstawy - Tech Handbook</title>'
          curl -fsS http://127.0.0.1:18080/pl/programming/python/python-podstawy | grep -Fq 'rel="canonical" href="https://techhandbook.nullyard.com/pl/programming/python/python-podstawy"'
          curl -fsS http://127.0.0.1:18080/pl/programming/python/python-podstawy | grep -Fq 'name="robots" content="index,follow,max-image-preview:large"'
          curl -fsS http://127.0.0.1:18080/en/programming/python/python-practical-handbook | grep -Fq '<article id="reader" class="markdown-body">'
          test "$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/definitely-not-existing-404-test)" = "404"
          curl -fsSI http://127.0.0.1:18080/md/pl/programming/python/python-basics.md | grep -qi '^content-type: text/markdown'

      - name: Stop test container
        if: always()
        run: docker rm -f techhandbook-ci >/dev/null 2>&1 || true
