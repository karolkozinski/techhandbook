<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Tech Handbook</title>
</head>
<body>
<script>
(() => {
  const projectBase = "/techhandbook/";
  const base = location.pathname.startsWith(projectBase) ? projectBase : "/";
  const relative = location.pathname.startsWith(base)
    ? location.pathname.slice(base.length)
    : location.pathname.replace(/^\/+/, "");
  const route = relative + location.search + location.hash;
  location.replace(base + "?__route=" + encodeURIComponent(route));
})();
</script>
</body>
</html>
