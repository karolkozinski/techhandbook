<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Null Yard Tech Handbook - praktyczna baza wiedzy technicznej.">
  <title>Null Yard Tech Handbook</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="assets/styles.css?v=20260920-home1">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Tech Handbook - strona główna">
        <img
          class="brand-mark"
          src="assets/nullyard_techhandbook_76x76.png"
          width="38"
          height="38"
          alt=""
          aria-hidden="true"
        >
        <span>
          <strong>Tech Handbook</strong>
          <small>Null Yard</small>
        </span>
      </a>

      <div class="top-actions">
        <label class="language-picker" for="languageSelect">
          <span class="sr-only">Język / Language</span>
          <select id="languageSelect" aria-label="Język / Language">
            <option value="pl">PL</option>
            <option value="en">ENG</option>
          </select>
        </label>
        <label class="mode-picker" for="modeSelect">
          <span class="sr-only">Tryb / Mode</span>
          <select id="modeSelect" aria-label="Tryb / Mode">
            <option value="standard">STANDARD</option>
            <option value="junior">JUNIOR</option>
          </select>
        </label>
        <button id="aboutButton" class="ghost-button" type="button">O projekcie</button>
        <button id="themeButton" class="ghost-button icon-button" type="button" aria-label="Zmień motyw">◐</button>
      </div>
    </header>

    <main class="layout">
      <aside class="browser-panel" aria-label="Przeglądarka kompendiów">
        <div class="search-wrap">
          <label id="searchLabel" for="searchInput">Szukaj</label>
          <div class="search-box">
            <input
              id="searchInput"
              type="search"
              placeholder="np. dns, freebsd, git*"
              autocomplete="off"
              spellcheck="false"
            >
            <kbd>/</kbd>
          </div>
          <p id="searchHint" class="search-hint">Nazwa, katalog, tytuł i tagi. Obsługuje <code>*</code>.</p>
        </div>

        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Ścieżka"></nav>

        <div class="browser-toolbar">
          <span id="locationLabel">md/</span>
          <span id="entryCount"></span>
        </div>

        <div id="fileBrowser" class="file-browser" role="list"></div>

        <div id="searchResults" class="search-results" hidden></div>
      </aside>

      <section class="reader-panel">
        <div id="welcome" class="welcome">
          <p class="eyebrow">NULL YARD / TECH HANDBOOK</p>
          <h1 id="welcomeTitle">Praktyczna baza wiedzy technicznej.</h1>
          <p id="welcomeText" class="welcome-text">Praktyczna baza wiedzy technicznej - od systemów i sieci po programowanie, web i AI.</p>

          <div id="welcomeStart" class="welcome-start">
            <p id="welcomeStartLabel" class="welcome-start-label">Zacznij tutaj</p>
            <div id="welcomeLinks" class="welcome-links"></div>
          </div>

          <div id="welcomeMeta" class="welcome-meta">
            <span id="welcomeStats" class="welcome-stats"></span>
            <button id="welcomeAbout" class="welcome-about" type="button">O projekcie</button>
          </div>
        </div>
        <article id="reader" class="markdown-body" hidden></article>

        <div id="readerTop" class="reader-top-wrap" hidden>
          <button class="reader-top" type="button">
            <span aria-hidden="true">↑</span>
            <span id="readerTopLabel">Do góry</span>
          </button>
        </div>

        <div id="readerError" class="reader-error" hidden>
          <h2 id="readerErrorTitle">Nie udało się otworzyć dokumentu</h2>
          <p id="readerErrorText"></p>
        </div>
      </section>
    </main>
<footer class="footer">
      <span>Null Yard Tech Handbook</span>
      <span id="indexInfo"></span>
    </footer>
  </div>

  <script defer src="https://stats.nullyard.com/script.js" data-website-id="cf98828c-ec2d-4152-a5ca-41718293e409"></script>
  <script src="assets/app.js?v=20260923-analytics1" defer></script>
</body>
</html>
