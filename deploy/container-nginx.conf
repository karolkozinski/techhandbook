server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/review-mode {
        proxy_pass http://review-api:8081/review-mode;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    location = /api/admin/reports {
        proxy_pass http://review-api:8081/admin/reports$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location = /api/admin/report-status {
        proxy_pass http://review-api:8081/admin/report-status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location = /admin/reports {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files /admin-reports.html =404;
    }

    location = /api/report {
        client_max_body_size 16k;
        proxy_pass http://review-api:8081/report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass_request_headers on;
    }

    location ~* \.md$ {
        types { text/markdown md; }
        default_type text/markdown;
        try_files $uri =404;
        expires 5m;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|webp)$ {
        try_files $uri =404;
        expires 7d;
    }

    location = /index.html {
        expires -1;
    }

    location = /content-index.json {
        expires 1m;
        try_files $uri =404;
    }

    location = /site-config.json {
        expires 1m;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 5m;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 5m;
        try_files $uri =404;
    }

    location = /llms.txt {
        expires 5m;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(?:pl|en)(?:/junior)?/?$ {
        try_files /index.html =404;
    }

    location ~ ^/(?:pl|en)(?:/junior)?/(?:about|search)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/(?:pl|en)(?:/junior)?/browse(?:/.*)?$ {
        try_files /index.html =404;
    }

    include /etc/nginx/generated-routes.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
