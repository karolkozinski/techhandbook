services:
  techhandbook:
    build:
      context: .
      dockerfile: Dockerfile
    image: techhandbook:local
    restart: unless-stopped
    depends_on:
      review-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TECHHANDBOOK_PORT:-8092}:8080"

  review-api:
    build:
      context: .
      dockerfile: Dockerfile.review-api
    image: techhandbook-review-api:local
    restart: unless-stopped
    environment:
      REVIEW_API_ENABLED: "${REVIEW_API_ENABLED:-false}"
      REVIEW_STAMP_SECRET: "${REVIEW_STAMP_SECRET:-}"
      REVIEW_ACCESS_TOKEN: "${REVIEW_ACCESS_TOKEN:-}"
      REVIEW_RATE_LIMIT_PER_HOUR: "${REVIEW_RATE_LIMIT_PER_HOUR:-30}"
      REVIEW_LLM_URL: "${REVIEW_LLM_URL:-}"
      REVIEW_LLM_API_KEY: "${REVIEW_LLM_API_KEY:-}"
      REVIEW_LLM_MODEL: "${REVIEW_LLM_MODEL:-}"
      REVIEW_CONTENT_ROOT: "/content"
    expose:
      - "8081"
    volumes:
      - review-data:/data
      - ./scripts/review_analyze.py:/app/review_analyze.py:ro
      - ./content-index.json:/content/content-index.json:ro
      - ./md:/content/md:ro

volumes:
  review-data:
